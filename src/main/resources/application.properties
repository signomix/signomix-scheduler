quarkus.container-image.builder=jib
quarkus.container-image.group=${SIGNOMIX_IMAGE_GROUP:${signomix.image.group.default}}
quarkus.container-image.name=${SIGNOMIX_IMAGE_NAME:signomix-scheduler}
quarkus.container-image.tag=${SIGNOMIX_IMAGE_TAG:%release%}

quarkus.scheduler.start-mode=forced



## REST Clients
com.signomix.scheduler.adapters.driven.ReportClient/mp-rest/url=${REPORTS_URL:http://signomix-reports:8080}

## MQTT
#

mp.messaging.outgoing.commands.connector=smallrye-mqtt
mp.messaging.outgoing.commands.host=signomix-broker
mp.messaging.outgoing.commands.port=1883
mp.messaging.outgoing.commands.topic=signomix/events/commands
mp.messaging.outgoing.commands.server-name=signomix-broker
mp.messaging.outgoing.commands.merge=true

mp.messaging.outgoing.events.connector=smallrye-mqtt
mp.messaging.outgoing.events.host=signomix-broker
mp.messaging.outgoing.events.port=1883
mp.messaging.outgoing.events.topic=signomix/events/commands
mp.messaging.outgoing.events.server-name=signomix-broker
mp.messaging.outgoing.events.merge=true

mp.messaging.outgoing.devicecommands.connector=smallrye-mqtt
mp.messaging.outgoing.devicecommands.host=signomix-broker
mp.messaging.outgoing.devicecommands.port=1883
mp.messaging.outgoing.devicecommands.topic=signomix/events/device-commands
mp.messaging.outgoing.devicecommands.server-name=signomix-broker

mp.messaging.outgoing.adminemail.connector=smallrye-mqtt
mp.messaging.outgoing.adminemail.host=signomix-broker
mp.messaging.outgoing.adminemail.port=1883
mp.messaging.outgoing.adminemail.topic=signomix/mailing/admin-email
mp.messaging.outgoing.adminemail.server-name=signomix-broker

mp.messaging.outgoing.email.connector=smallrye-mqtt
mp.messaging.outgoing.email.host=signomix-broker
mp.messaging.outgoing.email.port=1883
mp.messaging.outgoing.email.topic=signomix/mailing/email
mp.messaging.outgoing.email.server-name=signomix-broker

## MONITORING
signomix.monitoring.disk.free=${SIGNOMIX_DISK_FREE_MB:1000}

## LOGGING
quarkus.log.level=${SIGNOMIX_LOG_LEVEL:INFO}

## HTTP
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.access-log.enabled=true

## DATASOURCES
quarkus.datasource.olap.db-kind=postgresql
quarkus.datasource.olap.username=${POSTGRES_USER:postgres}
quarkus.datasource.olap.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.olap.jdbc.url=${POSTGRES_URL}
quarkus.datasource.oltp.db-kind=postgresql
quarkus.datasource.oltp.username=${POSTGRES_USER:postgres}
quarkus.datasource.oltp.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.oltp.jdbc.url=${POSTGRES_URL}

questdb.client.config=${SIGNOMIX_QUESTDB_CONFIG}

## OPEN TELEMTRY
quarkus.otel.service.name=${SIGNOMIX_AUTH_OTEL_NAME:signomix-scheduler}
quarkus.otel.exporter.otlp.endpoint=${SIGNOMIX_OTEL_ENDPOINT:http://signomix-otel-proxy:4319}
quarkus.otel.exporter.otlp.headers=${SIGNOMIX_OTEL_HEADERS}
# quarkus.otel.exporter.otlp.protocol=http/protobuf
# quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
# quarkus.otel.exporter.otlp.logs.protocol=http/protobuf
# quarkus.otel.exporter.otlp.metrics.protocol=http/pexporter.rotobuf
quarkus.otel.logs.enabled=true
#quarkus.otel.exporter.otlp.logs.endpoint=https://coroot.experiot.pl
quarkus.otel.logs.level=INFO
